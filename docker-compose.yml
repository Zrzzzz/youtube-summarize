services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: bgutil-provider
    # host 网络：yt-dlp 的 bgutil HTTP 插件默认访问 127.0.0.1:4416
    network_mode: host
    restart: unless-stopped

  app:
    build:
      context: .
      # 宿主机若跑透明代理（fakeip DNS），桥接网络在容器内不通，构建需用 host 网络
      network: host
      args:
        # 构建时下载 deno 用的代理（host 网络下可达宿主机 7890）
        DENO_DL_PROXY: http://127.0.0.1:7890
    container_name: youtube-summarize
    # 运行也用 host 网络：直接监听宿主机 8800，并复用宿主机的代理/DNS
    network_mode: host
    command: ["uv", "run", "--no-sync", "main.py", "serve", "--host", "0.0.0.0", "--port", "8800"]
    env_file: .env
    depends_on:
      - bgutil-provider
    volumes:
      - ./downloads:/app/downloads
      # 任务结果 / 失败 traceback 落盘（data/tasks.jsonl），容器重建不丢
      - ./data:/app/data
      # 不加 :ro——yt-dlp 退出时会把轮换后的 cookies 写回，只读挂载会直接报错
      - ./cookies.txt:/app/cookies.txt
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
